---
layout: default
---
{%- assign t = site.data.i18n[page.lang] -%}
{%- if page.doc_lang != page.lang and t.doc.note != "" %}
<p class="note doc-note">{{ t.doc.note }}</p>
{%- endif %}
<article class="doc flow" lang="{{ page.doc_lang }}">
  <h1>{{ page.doc_title }}</h1>
  {{ content }}
</article>
<p class="note"><a href="{{ page.source_url }}">{{ t.doc.source }} →</a></p>
