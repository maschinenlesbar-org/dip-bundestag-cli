# Website of this CLI. Everything in site/ is shared by every maschinenlesbar.org CLI
# except this file and _data/project.yml; see "Website" in DEVELOPING.md.

repository: maschinenlesbar-org/dip-bundestag-cli
url: https://maschinenlesbar.org
baseurl: /dip-bundestag-cli

org_url: https://maschinenlesbar.org/
plugins_url: https://maschinenlesbar.org/plugins/

# Read by _plugins/project.rb: the repository root with package.json, README.md, dist/ ...
project_root: ..

# Where the published manifest and the built CLI live, relative to project_root. Both
# default to the single-package layout (package.json, dist/src/cli/program.js); this
# repository is an npm workspace, so both are in the app's folder.
manifest: apps/cli/package.json
program: apps/cli/dist/src/cli/program.js

# Every language gets the full site; strings live in _data/i18n/<lang>.yml.
# The default language is served at the root, the others under /<lang>/.
languages: [en, de]
default_lang: en

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      lang: en

exclude:
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - node_modules
  - components
  - scripts
  - vendor
