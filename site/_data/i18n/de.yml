    Benötigt ein kostenloses Konto beim Datenanbieter: <code>%token%</code> setzen oder
    <code>%user%</code> und <code>%password%</code>. Es sind keine Zugangsdaten enthalten; wie Sie
    sich registrieren, steht in der <a href="%readme%">README</a>.

