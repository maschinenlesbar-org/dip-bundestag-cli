    Benötigt den kostenlosen, öffentlich dokumentierten API-Schlüssel: per
    <code>--api-key</code> oder über <code>%env%</code>. Es ist kein Schlüssel enthalten; woher
    Sie ihn bekommen, steht in der <a href="%readme%">README</a>.
