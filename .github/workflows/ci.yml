name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# One run per branch or PR: a newer push supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Tests run against the compiled output in dist/ (the `pretest` hook builds
      # first, so this also re-validates the build).
      - name: Test
        run: npm test

      # The real tarball, installed the way a user installs it: globally, into a scratch
      # prefix, with the registry out of reach — the app's prepack bundles the client and
      # commander, so the tarball must be self-contained (a global install once left
      # node_modules/commander empty in openka-cli, issue #1). The pack must also leave
      # nothing behind: prepack's copies in the app's node_modules would shadow the
      # workspace symlinks.
      - name: Packed tarballs install globally
        run: |
          # Every published app (apps/* that is not private): pack it, check the pack left
          # nothing behind, install it globally with the registry out of reach, run each bin.
          for app in apps/*/; do
            app="${app%/}"
            [ "$(node -p "require('./$app/package.json').private === true")" = true ] && continue
            pack="$RUNNER_TEMP/pack/$app"
            mkdir -p "$pack"
            npm pack --workspace "$app" --pack-destination "$pack"
            if [ -e "$app/node_modules" ] || [ -e "$app/dist/node_modules" ] || [ -e "$app/.prepack-generated.json" ]; then
              echo "::error::the pack left prepack's copies behind in $app"
              exit 1
            fi
            prefix="$RUNNER_TEMP/global/$app"
            npm install --global --offline --prefix "$prefix" "$pack"/*.tgz
            for bin in $(node -p "Object.keys(require('./$app/package.json').bin).join(' ')"); do
              "$prefix/bin/$bin" --version
            done
          done

  # The built MCP server against the official MCP client (tools/interop, its own lockfile,
  # installed without scripts): stdio and HTTP, the 2025 handshake and 2026-07-28.
  interop:
    name: MCP interop with the official client
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Install the MCP client (tools/interop)
        run: npm ci --ignore-scripts --prefix tools/interop

      - name: Interop
        run: node tools/interop/interop.mjs
