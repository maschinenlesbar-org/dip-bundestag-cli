name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# One run per branch or PR: a newer push supersedes the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Tests run against the compiled output in dist/ (the `pretest` hook builds
      # first, so this also re-validates the build).
      - name: Test
        run: npm test

      # The real tarball, installed the way a user installs it: globally, into a scratch
      # prefix, with the registry out of reach — the app's prepack bundles the client and
      # commander, so the tarball must be self-contained (a global install once left
      # node_modules/commander empty in openka-cli, issue #1). The pack must also leave
      # nothing behind: prepack's copies in the app's node_modules would shadow the
      # workspace symlinks.
      - name: Packed tarball installs globally
        run: |
          pack="$RUNNER_TEMP/pack"
          mkdir -p "$pack"
          npm pack --workspace apps/cli --pack-destination "$pack"
          if [ -e apps/cli/node_modules ] || [ -e apps/cli/dist/node_modules ] || [ -e apps/cli/.prepack-generated.json ]; then
            echo "::error::the pack left prepack's copies behind in apps/cli"
            exit 1
          fi
          prefix="$RUNNER_TEMP/global"
          npm install --global --offline --prefix "$prefix" "$pack"/*.tgz
          bin="$(node -p "Object.keys(require('./apps/cli/package.json').bin)[0]")"
          "$prefix/bin/$bin" --version
