name: Release

# Fires when a version tag is pushed, e.g. created by `npm run bump -- <patch|minor|major>`
# (which bumps apps/cli/package.json, commits and creates the matching tag). The repository
# is an npm workspace: the released package is apps/cli, which bundles packages/client.
#
# Three jobs, so no third-party code shares a job with the tarball or the write token:
#  - pack:    test, build the tarball, record its sha256 (contents: read);
#  - sbom:    the CycloneDX SBOMs, with the tool locked in tools/sbom (contents: read);
#  - release: check the tarball against the pack job's digest, then only `gh` (contents: write).
on:
  push:
    tags:
      - 'v*'

# Default to read-only; only the release job is granted contents: write below.
permissions:
  contents: read

# One release run per tag; never cancel one part-way through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    name: Test and pack
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      tarball-sha256: ${{ steps.pack.outputs.tarball-sha256 }}
      mcp-tarball: ${{ steps.pack.outputs.mcp-tarball }}
      mcp-tarball-sha256: ${{ steps.pack.outputs.mcp-tarball-sha256 }}
      notes: ${{ steps.changelog.outputs.notes }}
      notes-sha256: ${{ steps.changelog.outputs.notes-sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags — the changelog step below walks `git log`/`git
          # tag` back to the previous release, which a shallow (default) clone
          # doesn't have. fetch-depth: 0 alone doesn't reliably fetch every tag,
          # so fetch-tags is set explicitly too.
          fetch-depth: 0
          fetch-tags: true

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          # No cache restoration on tag-triggered runs (cache-poisoning hardening).
          package-manager-cache: false

      # The version lives in the app's package.json; the root one is a private workspace
      # manifest without a version.
      - name: Read version from apps/cli/package.json
        id: ver
        run: echo "version=$(node -p "require('./apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches apps/cli/package.json version
        env:
          PKG_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$PKG_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match apps/cli/package.json version '$PKG_VERSION'."
            exit 1
          fi
          # The apps are released together (tools/bump.mjs): the MCP server's version is the same.
          mcp="$(node -p "require('./apps/mcp/package.json').version")"
          if [ "$tag" != "$mcp" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match apps/mcp/package.json version '$mcp'."
            exit 1
          fi

      # Grouped by Conventional Commits type (feat/fix/docs/...) from the log
      # since the previous v* tag. Not committed to the repo — generated fresh
      # per release and attached to the GitHub Release only.
      - name: Generate changelog since the previous tag
        id: changelog
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist-artifacts
          notes="dip-bundestag-cli-${VERSION}.changelog.md"
          node .github/scripts/changelog.mjs "$GITHUB_REF_NAME" > "dist-artifacts/$notes"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "notes-sha256=$(sha256sum "dist-artifacts/$notes" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          cat "dist-artifacts/$notes"

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # `npm pack` produces the npm-native package tarball (.tgz). The app's prepack bundles
      # packages/client and commander into it. Its sha256 becomes a job output, which the
      # release job checks the downloaded tarball against.
      - name: Pack npm tarball
        id: pack
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          npm pack --workspace apps/cli --pack-destination dist-artifacts
          tarball="maschinenlesbar.org-dip-bundestag-cli-${VERSION}.tgz"
          test -f "dist-artifacts/$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "tarball-sha256=$(sha256sum "dist-artifacts/$tarball" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          npm pack --workspace apps/mcp --pack-destination dist-artifacts
          mcp="maschinenlesbar.org-dip-bundestag-mcp-${VERSION}.tgz"
          test -f "dist-artifacts/$mcp"
          echo "mcp-tarball=$mcp" >> "$GITHUB_OUTPUT"
          echo "mcp-tarball-sha256=$(sha256sum "dist-artifacts/$mcp" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          ls -la dist-artifacts

      - name: Upload the tarball and the notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist-artifacts/${{ steps.pack.outputs.tarball }}
            dist-artifacts/${{ steps.pack.outputs.mcp-tarball }}
            dist-artifacts/${{ steps.changelog.outputs.notes }}
          if-no-files-found: error
          retention-days: 1

  # CycloneDX SBOMs with exact, pinned versions and the full transitive closure, read from the
  # installed tree. Two files:
  #  - *.cdx.json      runtime/production graph — what consumers install
  #  - *.dev.cdx.json  full graph incl. devDependencies — the build env
  #
  # Both are scoped to the apps/cli workspace (the dev one adds the root's devDependencies, the
  # build toolchain). The SBOM's main component is the private workspace root, whose one
  # dependency is the released package; that package depends on commander (bundled). The
  # workspace packages ship inside it as files (dist/node_modules), so they are part of the
  # released package, not dependencies.
  #
  # The tool and its whole tree are locked in tools/sbom/package-lock.json and installed without
  # their install scripts; it runs in a job of its own, with a read-only token and no tarball, so
  # a compromised dependency can neither change what the pack job built nor touch the Release.
  sbom:
    name: SBOMs
    needs: pack
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          # No cache restoration on tag-triggered runs (cache-poisoning hardening).
          package-manager-cache: false

      # The SBOM describes the installed tree; no lifecycle script is needed for it.
      - name: Install the workspace
        run: npm ci --ignore-scripts

      - name: Install the SBOM tool (locked in tools/sbom)
        run: npm ci --ignore-scripts --prefix tools/sbom

      - name: Generate SBOMs (CycloneDX)
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          mkdir -p sbom
          base="sbom/dip-bundestag-cli-${VERSION}"
          tools/sbom/node_modules/.bin/cyclonedx-npm \
            --workspace apps/cli \
            --omit dev \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file "${base}.cdx.json"
          tools/sbom/node_modules/.bin/cyclonedx-npm \
            --workspace apps/cli \
            --include-workspace-root \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file "${base}.dev.cdx.json"
          mcp="sbom/dip-bundestag-mcp-${VERSION}"
          tools/sbom/node_modules/.bin/cyclonedx-npm \
            --workspace apps/mcp \
            --omit dev \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file "${mcp}.cdx.json"
          tools/sbom/node_modules/.bin/cyclonedx-npm \
            --workspace apps/mcp \
            --include-workspace-root \
            --spec-version 1.6 \
            --output-format JSON \
            --output-file "${mcp}.dev.cdx.json"
          ls -la sbom

      - name: Upload the SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            sbom/dip-bundestag-cli-${{ needs.pack.outputs.version }}.cdx.json
            sbom/dip-bundestag-cli-${{ needs.pack.outputs.version }}.dev.cdx.json
            sbom/dip-bundestag-mcp-${{ needs.pack.outputs.version }}.cdx.json
            sbom/dip-bundestag-mcp-${{ needs.pack.outputs.version }}.dev.cdx.json
          if-no-files-found: error
          retention-days: 1

  # The container image, built from the pack job's tarball after checking it against the
  # digest that job recorded, with tools/image (pins.json: base, BuildKit, registry). No npm runs
  # here and no scanner or SBOM tool: this job records the archive's digest, which the release
  # job trusts. The archive is pushed to a local registry with push.mjs (the script publish.yml
  # pushes to ghcr.io with) and smoke-tested from there. Reproducible: SOURCE_DATE_EPOCH is the
  # tagged commit's time, so a rebuild from the tarball gives the same index digest.
  image:
    name: Container image
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      archive: ${{ steps.build.outputs.archive }}
      archive-sha256: ${{ steps.build.outputs.archive-sha256 }}
      index: ${{ steps.build.outputs.index }}
      mcp-archive: ${{ steps.build.outputs.mcp-archive }}
      mcp-archive-sha256: ${{ steps.build.outputs.mcp-archive-sha256 }}
      mcp-index: ${{ steps.build.outputs.mcp-index }}
    services:
      registry:
        # tools/image/pins.json's registry pin, repeated: a service can't read a file.
        image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 127.0.0.1:5000:5000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          # No cache restoration on tag-triggered runs (cache-poisoning hardening).
          package-manager-cache: false

      - name: Download the tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Verify the tarballs against the pack job's digests
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.pack.outputs.tarball-sha256 }}
          MCP_TARBALL: ${{ needs.pack.outputs.mcp-tarball }}
          MCP_TARBALL_SHA256: ${{ needs.pack.outputs.mcp-tarball-sha256 }}
        run: printf '%s  %s\n' "$TARBALL_SHA256" "package/$TARBALL" "$MCP_TARBALL_SHA256" "package/$MCP_TARBALL" | sha256sum --check --strict -

      - name: Build the OCI archives
        id: build
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          MCP_TARBALL: ${{ needs.pack.outputs.mcp-tarball }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          mkdir -p image
          archive="dip-bundestag-cli-${VERSION}.oci.tar"
          node tools/image/build.mjs --app cli --tarball "package/$TARBALL" --out "image/$archive" > build.json
          cat build.json
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "archive-sha256=$(sha256sum "image/$archive" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "index=$(jq -r .index build.json)" >> "$GITHUB_OUTPUT"
          mcp="dip-bundestag-mcp-${VERSION}.oci.tar"
          node tools/image/build.mjs --app mcp --tarball "package/$MCP_TARBALL" --out "image/$mcp" > mcp-build.json
          cat mcp-build.json
          echo "mcp-archive=$mcp" >> "$GITHUB_OUTPUT"
          echo "mcp-archive-sha256=$(sha256sum "image/$mcp" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "mcp-index=$(jq -r .index mcp-build.json)" >> "$GITHUB_OUTPUT"

      - name: Push to a local registry and smoke-test
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
          INDEX: ${{ steps.build.outputs.index }}
          MCP_ARCHIVE: ${{ steps.build.outputs.mcp-archive }}
          MCP_INDEX: ${{ steps.build.outputs.mcp-index }}
        run: |
          node tools/image/push.mjs --archive "image/$ARCHIVE" --to 127.0.0.1:5000/dip-bundestag-cli:release
          node tools/image/smoke.mjs --app cli --image "127.0.0.1:5000/dip-bundestag-cli@$INDEX"
          node tools/image/push.mjs --archive "image/$MCP_ARCHIVE" --to 127.0.0.1:5000/dip-bundestag-mcp:release
          node tools/image/smoke.mjs --app mcp --image "127.0.0.1:5000/dip-bundestag-mcp@$MCP_INDEX"

      - name: Upload the archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: |
            image/${{ steps.build.outputs.archive }}
            image/${{ steps.build.outputs.mcp-archive }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # One CycloneDX SBOM per platform of the image (base image included: Debian's packages and
  # the Node binary, which the npm SBOMs don't see), made with syft, a release binary pinned by
  # sha256 in tools/image/pins.json. A job of its own after the digest is recorded; its outputs
  # are trusted for nothing. No vulnerability gate here: its database changes daily, so a gate
  # in a release run could leave a tag without a release. images.yml gates on push and weekly.
  image-sbom:
    name: Image SBOMs
    needs: [pack, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          # No cache restoration on tag-triggered runs (cache-poisoning hardening).
          package-manager-cache: false

      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: image

      - name: Verify the archives against the image job's digests
        env:
          ARCHIVE: ${{ needs.image.outputs.archive }}
          ARCHIVE_SHA256: ${{ needs.image.outputs.archive-sha256 }}
          MCP_ARCHIVE: ${{ needs.image.outputs.mcp-archive }}
          MCP_ARCHIVE_SHA256: ${{ needs.image.outputs.mcp-archive-sha256 }}
        run: printf '%s  %s\n' "$ARCHIVE_SHA256" "image/$ARCHIVE" "$MCP_ARCHIVE_SHA256" "image/$MCP_ARCHIVE" | sha256sum --check --strict -

      - name: Generate the image SBOMs (CycloneDX, per platform)
        env:
          ARCHIVE: ${{ needs.image.outputs.archive }}
          MCP_ARCHIVE: ${{ needs.image.outputs.mcp-archive }}
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          node tools/image/sbom.mjs --archive "image/$ARCHIVE" --name "dip-bundestag-cli-${VERSION}" --out image-sbom
          node tools/image/sbom.mjs --archive "image/$MCP_ARCHIVE" --name "dip-bundestag-mcp-${VERSION}" --out image-sbom

      - name: Upload the image SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: |
            image-sbom/dip-bundestag-cli-${{ needs.pack.outputs.version }}.amd64.image.cdx.json
            image-sbom/dip-bundestag-cli-${{ needs.pack.outputs.version }}.arm64.image.cdx.json
            image-sbom/dip-bundestag-mcp-${{ needs.pack.outputs.version }}.amd64.image.cdx.json
            image-sbom/dip-bundestag-mcp-${{ needs.pack.outputs.version }}.arm64.image.cdx.json
          if-no-files-found: error
          retention-days: 1

  # Signed build provenance (Sigstore, through GitHub's attestations API) for the tarball, the
  # image archive and the image index, from the digests the pack and image jobs recorded. No
  # checkout, no file: the subjects are the job outputs. Users check a file with
  # `gh attestation verify <file> --repo <repo>` and the image with `gh attestation verify
  # oci://<image>:<tag> --repo <repo>`; publish.yml checks the files before it publishes them.
  attest:
    name: Attest the release files and the image
    needs: [pack, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the Sigstore signing certificate
      attestations: write # store the attestation
      artifact-metadata: write # link it to the artifact

    steps:
      - name: Write the subjects
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.pack.outputs.tarball-sha256 }}
          ARCHIVE: ${{ needs.image.outputs.archive }}
          ARCHIVE_SHA256: ${{ needs.image.outputs.archive-sha256 }}
          INDEX: ${{ needs.image.outputs.index }}
          MCP_TARBALL: ${{ needs.pack.outputs.mcp-tarball }}
          MCP_TARBALL_SHA256: ${{ needs.pack.outputs.mcp-tarball-sha256 }}
          MCP_ARCHIVE: ${{ needs.image.outputs.mcp-archive }}
          MCP_ARCHIVE_SHA256: ${{ needs.image.outputs.mcp-archive-sha256 }}
          MCP_INDEX: ${{ needs.image.outputs.mcp-index }}
        run: |
          printf '%s  %s\n' \
            "$TARBALL_SHA256" "$TARBALL" \
            "$ARCHIVE_SHA256" "$ARCHIVE" \
            "${INDEX#sha256:}" "dip-bundestag-cli" \
            "$MCP_TARBALL_SHA256" "$MCP_TARBALL" \
            "$MCP_ARCHIVE_SHA256" "$MCP_ARCHIVE" \
            "${MCP_INDEX#sha256:}" "dip-bundestag-mcp" > "$RUNNER_TEMP/subjects.txt"
          cat "$RUNNER_TEMP/subjects.txt"

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt

  # The only job with a write token: no checkout, no npm, no Node, only the runner's
  # preinstalled gh CLI on files it has checked.
  release:
    name: Create GitHub Release
    needs: [pack, sbom, image, image-sbom, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload its assets

    steps:
      - name: Download the tarball and the notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - name: Download the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom

      - name: Download the image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
          path: image

      - name: Download the image SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-sbom
          path: image-sbom

      # The pack job's digests are job outputs, recorded by the runner: an artifact changed
      # after its upload (by the SBOM job, say) fails here, before anything is published.
      - name: Verify the tarballs, the notes and the image archives against the recorded digests
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.pack.outputs.tarball-sha256 }}
          NOTES: ${{ needs.pack.outputs.notes }}
          NOTES_SHA256: ${{ needs.pack.outputs.notes-sha256 }}
          ARCHIVE: ${{ needs.image.outputs.archive }}
          ARCHIVE_SHA256: ${{ needs.image.outputs.archive-sha256 }}
          MCP_TARBALL: ${{ needs.pack.outputs.mcp-tarball }}
          MCP_TARBALL_SHA256: ${{ needs.pack.outputs.mcp-tarball-sha256 }}
          MCP_ARCHIVE: ${{ needs.image.outputs.mcp-archive }}
          MCP_ARCHIVE_SHA256: ${{ needs.image.outputs.mcp-archive-sha256 }}
        run: |
          printf '%s  %s\n' "$TARBALL_SHA256" "package/$TARBALL" "$NOTES_SHA256" "package/$NOTES" "$ARCHIVE_SHA256" "image/$ARCHIVE" | sha256sum --check --strict -
          printf '%s  %s\n' "$MCP_TARBALL_SHA256" "package/$MCP_TARBALL" "$MCP_ARCHIVE_SHA256" "image/$MCP_ARCHIVE" | sha256sum --check --strict -

      # After the check: the notes get the image's index digest (what `docker pull` resolves a
      # tag to) and SHA256SUMS lists the checked files, for readers. The attestations are what
      # proves them.
      - name: Add the image digest to the notes, write SHA256SUMS
        env:
          TARBALL: ${{ needs.pack.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.pack.outputs.tarball-sha256 }}
          NOTES: ${{ needs.pack.outputs.notes }}
          ARCHIVE: ${{ needs.image.outputs.archive }}
          ARCHIVE_SHA256: ${{ needs.image.outputs.archive-sha256 }}
          INDEX: ${{ needs.image.outputs.index }}
          MCP_TARBALL: ${{ needs.pack.outputs.mcp-tarball }}
          MCP_TARBALL_SHA256: ${{ needs.pack.outputs.mcp-tarball-sha256 }}
          MCP_ARCHIVE: ${{ needs.image.outputs.mcp-archive }}
          MCP_ARCHIVE_SHA256: ${{ needs.image.outputs.mcp-archive-sha256 }}
          MCP_INDEX: ${{ needs.image.outputs.mcp-index }}
        run: |
          {
            printf '\n## Container images\n\nIndex digests (linux/amd64, linux/arm64); check one with `gh attestation verify oci://<image>@<digest> --repo %s`.\n\n' "$GITHUB_REPOSITORY"
            printf -- '- `ghcr.io/%s/dip-bundestag-cli`: `%s`\n' "$GITHUB_REPOSITORY_OWNER" "$INDEX"
            printf -- '- `ghcr.io/%s/dip-bundestag-mcp`: `%s`\n' "$GITHUB_REPOSITORY_OWNER" "$MCP_INDEX"
          } >> "package/$NOTES"
          printf '%s  %s\n' "$TARBALL_SHA256" "$TARBALL" "$ARCHIVE_SHA256" "$ARCHIVE" "$MCP_TARBALL_SHA256" "$MCP_TARBALL" "$MCP_ARCHIVE_SHA256" "$MCP_ARCHIVE" > SHA256SUMS

      # With assets, gh creates the release as a draft, uploads them, then publishes it.
      # The assets are named one by one, so nothing else an artifact may hold is attached.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.pack.outputs.version }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
          NOTES: ${{ needs.pack.outputs.notes }}
          ARCHIVE: ${{ needs.image.outputs.archive }}
          MCP_TARBALL: ${{ needs.pack.outputs.mcp-tarball }}
          MCP_ARCHIVE: ${{ needs.image.outputs.mcp-archive }}
        # No PRs land in this repo (see CONTRIBUTING.md), so GitHub's own
        # generated notes have nothing to list — --generate-notes only adds the
        # "Full Changelog: vX...vY" compare link after our own notes above.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "package/$NOTES" \
            --generate-notes \
            "package/$TARBALL" \
            "sbom/dip-bundestag-cli-${VERSION}.cdx.json" \
            "sbom/dip-bundestag-cli-${VERSION}.dev.cdx.json" \
            "image/$ARCHIVE" \
            "image-sbom/dip-bundestag-cli-${VERSION}.amd64.image.cdx.json" \
            "image-sbom/dip-bundestag-cli-${VERSION}.arm64.image.cdx.json" \
            "package/$MCP_TARBALL" \
            "sbom/dip-bundestag-mcp-${VERSION}.cdx.json" \
            "sbom/dip-bundestag-mcp-${VERSION}.dev.cdx.json" \
            "image/$MCP_ARCHIVE" \
