name: Publish

# Manually publish a released version to the npm registry, run from its tag:
#
#   gh workflow run publish.yml -R <owner>/<repo> --ref vX.Y.Z
#
# The version is the tag's (vX.Y.Z -> X.Y.Z); a run from a branch fails. Running
# from the tag also means this file is the one the release was cut with.
#
# Authentication uses npm Trusted Publishing (OIDC): GitHub mints a short-lived
# token for this run and npm verifies it against the trusted publisher
# configured for the package — no long-lived NPM_TOKEN is stored.
#
# One-time setup on npmjs.com: package `@maschinenlesbar.org/dip-bundestag-cli` ->
# Settings -> Trusted Publisher -> GitHub Actions, this repo, workflow `publish.yml`.
on:
  workflow_dispatch:

# Least privilege at the workflow level: only read. The OIDC id-token scope is
# granted per-job, to the publish job that actually needs it.
permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC); provenance is attached automatically

    steps:
      - name: Take the version from the release tag
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v*) version="${REF#refs/tags/v}" ;;
            *)
              echo "::error::Run this workflow from a release tag (gh workflow run publish.yml --ref vX.Y.Z), not from $REF."
              exit 1
              ;;
          esac
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag v$version is not a release version (vX.Y.Z)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Publish exactly the tagged source.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          # Trusted publishing requires npm >= 11.5.1. Node 24 bundles it (Node 22
          # still ships npm 10), so npm itself is never installed ad hoc from the
          # registry inside this id-token: write job, where a compromised package
          # would run with the token that mints the provenance attestation.
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          # No cache restoration in the publishing job (cache-poisoning hardening).
          package-manager-cache: false

      - name: Verify bundled npm supports Trusted Publishing (>= 11.5.1)
        run: |
          npm_version="$(npm --version)"
          if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$npm_version"; then
            echo "::error::npm $npm_version is older than 11.5.1, which Trusted Publishing requires."
            exit 1
          fi

      - name: Verify package.json matches the tag
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$VERSION" ]; then
            echo "::error::package.json version ('$pkg') does not match the tag (v$VERSION)."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # The `prepack` hook (npm run build) produces dist/ before packing.
      # No NPM_TOKEN: OIDC provides the short-lived credential, and provenance
      # is generated from this workflow run.
      - name: Publish to npm
        run: npm publish --provenance --access public
